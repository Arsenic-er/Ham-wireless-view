[package]
name = "hamheatmap-desktop"
version = "0.1.0"
description = "Windows desktop shell for HamHeatmap"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[lib]
name = "hamheatmap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
hamheatmap-app-service = { path = "../../crates/app-service" }
hamheatmap-cache = { path = "../../crates/cache" }
hamheatmap-export = { path = "../../crates/export" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zeroize = "1.8.2"

[dev-dependencies]
serde_json = "1.0.150"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-dialog = "=2.7.1"

