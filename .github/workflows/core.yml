name: core

on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source attribution coverage
        run: python3 scripts/check-source-attribution.py
      - name: Verify localized README pages
        run: python3 scripts/check-readme-locales.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Run propagation tests
        run: cargo +1.97.0 test --workspace --all-targets --locked

